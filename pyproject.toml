[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-irc"
version = "0.1.0"
description = "A clean asyncio IRC client optimized for Termux on Android"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CommunityPoke" }]
keywords = ["irc", "termux", "android", "asyncio", "tui"]
classifiers = [
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat :: Internet Relay Chat",
]
# Runtime uses only the standard library — zero dependencies.

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
termux-irc = "termux_irc.cli:main"
tirc = "termux_irc.cli:main"

[project.urls]
Repository = "https://github.com/CommunityPokeOrg/termux-irc"

[tool.setuptools]
packages = ["termux_irc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 92

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "PL", "B", "ASYNC", "S"]
ignore = [
    "S101",   # asserts are fine in tests
    "PLR2004",# magic numbers in a protocol implementation
    "PLW2901",# loop var rebinding in parsers
    "ASYNC109",# timeout params on test helpers are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106"]               # fake credentials in test fixtures
"termux_irc/ui.py" = ["PLR0911", "PLR0912", "PLR0915"]  # key dispatch + renderer
"termux_irc/app.py" = ["PLR0911", "PLR0912", "PLR0915"]  # protocol dispatch table
"termux_irc/client.py" = ["PLR0913"]       # constructor takes connection params
