# termux-irc configuration
# Copy to ~/.config/termux-irc/config.toml and edit.

server = "irc.libera.chat"
# port = 6697                # default: 6697 with tls, 6667 without
tls = true                   # set false for plaintext
# tls_verify = true          # set false only for self-signed servers
nick = "tux"
user = "tux"
realname = "termux-irc user"
# password = "server-password"  # prefer TERMUX_IRC_PASSWORD env instead
channels = ["#termux"]
reconnect = true

# Termux:API integration (no-op on regular Linux/macOS; needs the
# Termux:API app + `pkg install termux-api` on Android)
termux = true        # master switch for all termux-api features
notify = true        # Android notifications on mentions/PMs
vibrate = true       # vibrate on mentions/highlights
toast = true         # toasts on connect/disconnect
clipboard = true     # /paste and /copy commands
system_info = true   # battery + wifi in /status
